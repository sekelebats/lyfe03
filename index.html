<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>minimal blog — plex mono writer</title>
    <!-- IBM Plex Mono: clean, monospaced, characterful -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f2efe7;   /* softly worn paper */
            font-family: 'IBM Plex Mono', 'Courier New', monospace;
            color: #1e1e1c;
            line-height: 1.5;
            padding: 2rem 1.5rem;
        }

        /* main container — narrow, crisp, airy */
        .container {
            max-width: 880px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.03), 0 0 0 1px rgba(0, 0, 0, 0.02);
            overflow: hidden;
            padding: 2rem 2rem 2.5rem 2rem;
            transition: all 0.2s ease;
        }

        /* header area */
        .top-header {
            margin-bottom: 2.2rem;
            border-bottom: 2px solid #eae6df;
            padding-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 0.75rem;
        }
        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #2d2a24, #5e5a52);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .sub {
            font-size: 0.75rem;
            color: #8f8b82;
            margin-top: 0.2rem;
            letter-spacing: -0.2px;
        }
        .clear-all-btn {
            background: transparent;
            border: 1px solid #e0dbd1;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.75rem;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            color: #6b645a;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 500;
        }
        .clear-all-btn:hover {
            background: #f9f7f3;
            border-color: #cbc3b7;
            color: #2c2823;
        }

        /* form card — minimal but tactile */
        .write-section {
            background: #fefcf9;
            border-radius: 24px;
            padding: 1.5rem;
            margin-bottom: 2.5rem;
            border: 1px solid #ede9e2;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
        }
        .form-group {
            margin-bottom: 1.4rem;
        }
        label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: #7b766c;
            display: block;
            margin-bottom: 0.5rem;
        }
        input, textarea {
            width: 100%;
            font-family: 'IBM Plex Mono', monospace;
            background: #ffffff;
            border: 1px solid #e2dbd0;
            border-radius: 20px;
            padding: 0.85rem 1.2rem;
            font-size: 0.9rem;
            transition: 0.2s;
            color: #1e1e1c;
            resize: vertical;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #b9aea0;
            box-shadow: 0 0 0 3px rgba(185, 174, 160, 0.2);
        }
        textarea {
            min-height: 130px;
        }
        .btn-primary {
            background: #1e1e1c;
            border: none;
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 500;
            padding: 0.85rem 1.6rem;
            border-radius: 40px;
            font-size: 0.85rem;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            letter-spacing: -0.2px;
        }
        .btn-primary:hover {
            background: #3c3832;
            transform: translateY(-1px);
        }
        .btn-primary:active {
            transform: translateY(1px);
        }

        /* posts header with counter */
        .posts-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 1.25rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .posts-header h2 {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: -0.3px;
        }
        .post-count {
            font-size: 0.7rem;
            background: #f0ede8;
            padding: 0.2rem 0.7rem;
            border-radius: 30px;
            color: #5b554b;
        }

        /* blog feed — minimal cards */
        .blog-feed {
            display: flex;
            flex-direction: column;
            gap: 1.3rem;
        }
        .blog-card {
            background: #ffffff;
            border: 1px solid #eee9e2;
            border-radius: 24px;
            padding: 1.4rem 1.5rem;
            transition: all 0.15s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.01);
        }
        .blog-card:hover {
            border-color: #dad2c6;
            background: #fefdfb;
        }
        .blog-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.3px;
            word-break: break-word;
            color: #2b2925;
        }
        .blog-content {
            font-size: 0.85rem;
            color: #49453e;
            margin-bottom: 1rem;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .blog-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-top: 0.5rem;
            border-top: 1px dashed #ece6de;
            padding-top: 0.8rem;
            font-size: 0.7rem;
        }
        .timestamp {
            color: #a69f94;
            letter-spacing: -0.2px;
        }
        .delete-btn {
            background: none;
            border: none;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.7rem;
            color: #bdaca0;
            cursor: pointer;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            transition: all 0.15s;
            font-weight: 500;
        }
        .delete-btn:hover {
            color: #db4d3f;
            background: #fff3f0;
        }

        /* empty state */
        .empty-message {
            text-align: center;
            padding: 2.5rem 1rem;
            color: #bbb2a6;
            font-size: 0.85rem;
            border: 1px dashed #e7e1d8;
            border-radius: 32px;
            background: #fefcf9;
        }

        hr {
            margin: 1.5rem 0 0.5rem;
            border: none;
            border-top: 1px solid #f0ebe4;
        }

        footer {
            margin-top: 2rem;
            font-size: 0.65rem;
            text-align: center;
            color: #bfb7ac;
            letter-spacing: -0.2px;
        }

        @media (max-width: 580px) {
            body {
                padding: 1rem;
            }
            .container {
                padding: 1.5rem;
            }
            .write-section {
                padding: 1rem;
            }
            .blog-card {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="top-header">
        <div>
            <h1>⎯ ⎯ WRITE BLOG ⎯</h1>
            <div class="sub">IBM Plex Mono · minimal archive</div>
        </div>
        <button class="clear-all-btn" id="clearAllBtn" aria-label="delete all posts">clear all posts</button>
    </div>

    <!-- writing zone -->
    <div class="write-section">
        <div class="form-group">
            <label>✍️ TITLE</label>
            <input type="text" id="blogTitle" placeholder="e.g., morning rituals, monospace dreams" autocomplete="off">
        </div>
        <div class="form-group">
            <label>📝 CONTENT</label>
            <textarea id="blogContent" placeholder="write freely, save locally …"></textarea>
        </div>
        <button class="btn-primary" id="publishBtn">+ PUBLISH ENTRY</button>
    </div>

    <!-- blog list header + dynamic feed -->
    <div class="posts-header">
        <h2>✦ written notes</h2>
        <span class="post-count" id="postCount">0 posts</span>
    </div>
    <div id="blogFeedContainer" class="blog-feed">
        <!-- dynamic posts injected here -->
    </div>
    <hr />
    <footer>local storage · everything stays in your browser</footer>
</div>

<script>
    (function() {
        // ---------- DOM elements ----------
        const titleInput = document.getElementById('blogTitle');
        const contentInput = document.getElementById('blogContent');
        const publishBtn = document.getElementById('publishBtn');
        const feedContainer = document.getElementById('blogFeedContainer');
        const postCountSpan = document.getElementById('postCount');
        const clearAllBtn = document.getElementById('clearAllBtn');

        // storage key
        const STORAGE_KEY = 'minimal_blog_plex';

        // ---------- blog posts array ----------
        let posts = [];

        // ---------- helper: save to localStorage ----------
        function persistPosts() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
        }

        // ---------- load from localStorage or init with 2 demo posts ----------
        function loadPostsFromStorage() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    const parsed = JSON.parse(stored);
                    if (Array.isArray(parsed)) {
                        posts = parsed;
                        return;
                    }
                } catch(e) { console.warn(e); }
            }
            // if empty / invalid: create gentle demo posts (minimal, relevant)
            const now = new Date();
            const demoPosts = [
                {
                    id: 'demo1_' + Date.now() + '_1',
                    title: 'welcome to minimal blog',
                    content: 'this is a space for raw thoughts. write anything — drafts, poetry, daily logs.\n\nall entries are saved to your browser. no cloud, no clutter.',
                    timestamp: now.toLocaleString(),
                },
                {
                    id: 'demo2_' + Date.now() + '_2',
                    title: 'ibm plex mono :: the charm of monospace',
                    content: 'a monospace writer keeps you focused. every character matters. use this tool to collect fragments, notes, or entire essays.\n\ndelete or add as you like.',
                    timestamp: new Date(now.getTime() - 86400000).toLocaleString(), // yesterday vibe
                }
            ];
            posts = demoPosts;
            persistPosts();
        }

        // ---------- render all blog posts (safe, no innerHTML injection) ----------
        function renderFeed() {
            if (!feedContainer) return;
            // clear container
            feedContainer.innerHTML = '';
            
            if (!posts.length) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'empty-message';
                emptyDiv.textContent = '✧ no entries yet · write your first blog above ✧';
                feedContainer.appendChild(emptyDiv);
                postCountSpan.textContent = '0 posts';
                return;
            }
            
            // update post count
            postCountSpan.textContent = `${posts.length} ${posts.length === 1 ? 'post' : 'posts'}`;
            
            // loop & build each card (safe DOM methods)
            for (let i = 0; i < posts.length; i++) {
                const post = posts[i];
                const card = document.createElement('article');
                card.className = 'blog-card';
                
                // title
                const titleEl = document.createElement('h3');
                titleEl.className = 'blog-title';
                titleEl.textContent = post.title && post.title.trim() !== '' ? post.title : '[untitled]';
                
                // content
                const contentEl = document.createElement('div');
                contentEl.className = 'blog-content';
                contentEl.textContent = post.content && post.content.trim() !== '' ? post.content : '(empty entry)';
                
                // meta row (timestamp + delete button)
                const metaRow = document.createElement('div');
                metaRow.className = 'blog-meta';
                
                const timeSpan = document.createElement('span');
                timeSpan.className = 'timestamp';
                timeSpan.textContent = post.timestamp || 'just now';
                
                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.textContent = '✕ DELETE';
                delBtn.setAttribute('data-id', post.id);
                delBtn.setAttribute('aria-label', 'delete blog post');
                
                metaRow.appendChild(timeSpan);
                metaRow.appendChild(delBtn);
                
                card.appendChild(titleEl);
                card.appendChild(contentEl);
                card.appendChild(metaRow);
                
                feedContainer.appendChild(card);
            }
        }
        
        // ---------- add new blog post ----------
        function addNewPost() {
            let rawTitle = titleInput.value;
            let rawContent = contentInput.value;
            
            // trim spaces
            const trimmedTitle = rawTitle ? rawTitle.trim() : '';
            const trimmedContent = rawContent ? rawContent.trim() : '';
            
            // edge case: both empty -> alert minimal feedback
            if (trimmedTitle === '' && trimmedContent === '') {
                alert('⛔ please write a title or some content before publishing.');
                return;
            }
            
            // set default if needed but still informative
            const finalTitle = trimmedTitle === '' ? 'untitled note' : trimmedTitle;
            const finalContent = trimmedContent === '' ? '— no content written —' : trimmedContent;
            
            const newPost = {
                id: Date.now() + '_' + Math.random().toString(36).substring(2, 8),
                title: finalTitle,
                content: finalContent,
                timestamp: new Date().toLocaleString(),
            };
            
            posts.unshift(newPost);   // newest first
            persistPosts();
            renderFeed();
            
            // clear form fields for next writing session
            titleInput.value = '';
            contentInput.value = '';
            // optional: subtle focus on title again
            titleInput.focus();
        }
        
        // ---------- delete single post by id (event delegation handled) ----------
        function deletePostById(postId) {
            const initialLength = posts.length;
            posts = posts.filter(post => post.id !== postId);
            if (posts.length !== initialLength) {
                persistPosts();
                renderFeed();
            }
        }
        
        // ---------- clear all posts (with confirm) ----------
        function clearAllPosts() {
            if (posts.length === 0) return;
            const userConfirmed = confirm('⚠️ delete ALL blog posts? this action cannot be undone.');
            if (userConfirmed) {
                posts = [];
                persistPosts();
                renderFeed();
            }
        }
        
        // ---------- event delegation for delete buttons (dynamic) ----------
        function setupDelegation() {
            if (!feedContainer) return;
            feedContainer.addEventListener('click', (e) => {
                const deleteButton = e.target.closest('.delete-btn');
                if (deleteButton && deleteButton.getAttribute('data-id')) {
                    const id = deleteButton.getAttribute('data-id');
                    deletePostById(id);
                }
            });
        }
        
        // ---------- publish button click handler ----------
        function initEventListeners() {
            if (publishBtn) {
                publishBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    addNewPost();
                });
            }
            if (clearAllBtn) {
                clearAllBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    clearAllPosts();
                });
            }
            // optional: allow enter (ctrl+enter) in textarea to publish quickly but minimal not overkill
            // but we add a nice micro interaction: ctrl+enter on textarea -> publish
            if (contentInput) {
                contentInput.addEventListener('keydown', (e) => {
                    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                        e.preventDefault();
                        addNewPost();
                    }
                });
            }
            // also if focus title and press enter, don't submit weirdly, but it's fine.
            titleInput?.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    if (contentInput) contentInput.focus();
                }
            });
        }
        
        // ---------- initial load & rendering ----------
        function init() {
            loadPostsFromStorage();   // fills posts array from storage or demo posts
            renderFeed();
            setupDelegation();
            initEventListeners();
        }
        
        // run everything
        init();
    })();
</script>
</body>
</html>
